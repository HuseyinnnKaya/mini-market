<!DOCTYPE html>
<html lang="tr">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini Market</title>
    <link rel="stylesheet" href="style.css">
    <script src="products.js" defer></script>
    <script src="app.js" defer></script>
  </head>
  <body>
    <header>
      <h1>Mini Market</h1>
      <input id="search-input" type="search" placeholder="Ürün ara..." aria-label="Ürün ara">
      <select id="category-select" aria-label="Kategori filtresi">
        <option value="Tümü">Tümü</option>
        <option value="Süt Ürünleri">Süt Ürünleri</option>
        <option value="Unlu Mamuller">Unlu Mamuller</option>
        <option value="Meyve &amp; Sebze">Meyve &amp; Sebze</option>
        <option value="Bakliyat">Bakliyat</option>
      </select>
      <select id="sort-select" aria-label="Fiyata göre sırala">
        <option value="default">Varsayılan</option>
        <option value="price-asc">Fiyat: Düşükten Yükseğe</option>
        <option value="price-desc">Fiyat: Yüksekten Düşüğe</option>
      </select>
      <button id="theme-toggle" type="button" aria-label="Temayı değiştir">🌙</button>
    </header>

    <main>
      <section aria-label="Ürünler">
        <div id="product-list"></div>
      </section>

      <aside id="cart" aria-label="Sepet">
        <h2>Sepet</h2>
      </aside>
    </main>
  </body>
</html>
